<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="#2E5D3C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="frontierstatelaw.com">
  <title>frontierstatelaw.com</title>
  <!-- The maker's mark, drawn once in build/byline.js and copied here by
       tools/make_favicon.py. The stroke is the literal #2E5D3C rather than
       currentColor: a favicon is loaded outside any document, so currentColor
       has nothing to inherit and would resolve to black.
       Trunk: outlined column, rounded cap, centred at x=12. -->
  <path d="M9.4 21.6V4.6a2.6 2.6 0 0 1 5.2 0V21.6"/>
  <!-- Left arm: same outlined construction, 4.0 wide, 2.4 of horizontal off
       the trunk, then a 4.8/0.8 elbow turns it up to a 2.0 rounded cap. -->
  <path d="M9.4 18.2H7a4.8 4.8 0 0 1-4.8-4.8V9a2 2 0 0 1 4 0v4.4a.8.8 0 0 0 .8.8h1.8"/>
  <!-- Right arm: mirrored, attached higher. -->
  <path d="M14.6 15.6H17a4.8 4.8 0 0 0 4.8-4.8V7a2 2 0 0 0-4 0v3.8a.8.8 0 0 1-.8.8h-2.4"/>
  <!-- Ground rule. -->
  <path d="M5.6 21.6h12.8"/>
</svg>
